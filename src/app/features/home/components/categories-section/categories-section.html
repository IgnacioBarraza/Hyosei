<section class="mb-8 md:mb-16">
  <div class="mb-4 flex items-center justify-between md:mb-8">
    <h2 class="text-xl font-bold tracking-tight md:text-3xl">
      Asignaturas de Proyectos
    </h2>
    <p-button
      variant="outlined"
      link
      size="small"
      class="h-8 px-2 text-xs md:h-10 md:px-4 md:text-sm bg-transparent"
      (onClick)="navigateToCategories()"
      >Ver todas
      <i class="pi pi-chevron-right ml-1 h-3 w-3 md:ml-2 md:h-4 md:w-4"></i>
    </p-button>
  </div>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 md:gap-6">
    @for (category of categories; track category.id) {
    <p-card
      key="{categoria.id}"
      class="group overflow-hidden transition-all duration-300 hover:shadow-lg hover:-translate-y-1"
    >
      <!-- {/* Barra de color superior */} -->
      <div class="{{category.color}} h-2 w-full"></div>

      <div class="p-4 md:p-6">
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3
              class="text-lg font-bold text-foreground md:text-xl group-hover:text-primary transition-colors"
            >
              {{category.name}}
            </h3>
            <p-badge
              variant="secondary"
              class="text-xs px-3 rounded-2xl bg-secondary text-color"
              [value]="category.projects + ' proyectos'"
            ></p-badge>
          </div>

          <p class="text-sm text-muted-foreground leading-relaxed md:text-base">
            {{category.description}}
          </p>

          <div class="pt-2">
            <p-button
              link
              class="h-auto p-0 text-sm font-medium text-primary hover:text-primary/80 group-hover:translate-x-1 transition-all flex items-center gap-1"
              (onClick)="navigateToProjects(category.id)"
            >
              Explorar proyectos
              <i class="pi pi-chevron-right"></i>
            </p-button>
          </div>
        </div>
      </div>
    </p-card>
    }
  </div>
</section>
