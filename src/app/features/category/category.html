<div class="container mx-auto py-8">
  <div class="mb-8">
    <h1 class="text-3xl font-bold tracking-tight md:text-4xl">
      Asignaturas de Proyectos
    </h1>
    <p class="mt-2 text-muted-foreground">
      Explora las diferentes asignaturas de proyectos presentados en
      <strong>{{ expoName }}</strong>
    </p>
  </div>

  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (category of categories; track category.id) {
    <p-card class="overflow-hidden">
      <div
        class="{{category.color}} flex flex-row items-center gap-4 p-4 font-bold text-black"
      >
        <div>{{category.name}}</div>
      </div>
      <div class="p-4">
        <p class="text-base">{{category.description}}</p>
      </div>
      <div class="p-4 pt-0 mt-auto flex">
        <a
          pButton
          [routerLink]="['/', apiKey, 'event', eventId, 'proyectos']"
          [queryParams]="{ categoria: category.id }"
          class="w-full border-neutral-400 hover:bg-neutral-200 bg-transparent border rounded-sm h-12 flex items-center justify-center"
        >
          Ver detalles
        </a>
      </div>
    </p-card>
    }
  </div>
</div>
